# AI Chatbot System Configuration

model:
  name: "distilbert-base-uncased"
  max_length: 128
  batch_size: 16
  epochs: 5
  learning_rate: 3.0e-5
  confidence_threshold: 0.65
  model_dir: "models/intent_classifier"
  onnx_model_path: "models/intent_classifier/model_quantized.onnx"

context:
  window_size: 5
  session_ttl_minutes: 60

database:
  url: "sqlite:///chatbot.db"
  pool_size: 10
  max_overflow: 20

api:
  host: "0.0.0.0"
  port: 5000
  debug: false

logging:
  level: "INFO"
  format: "json"
